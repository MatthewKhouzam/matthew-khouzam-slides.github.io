image: node:20-alpine

cache:
  key:
    files:
      - astro-site/pnpm-lock.yaml
  paths:
    - .pnpm-store/

pages:
  tags:
    - docker
  script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm config set store-dir ../.pnpm-store
    - cd astro-site
    - pnpm install --frozen-lockfile
    - pnpm build
    - rm -rf ../public
    - mv dist ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
